name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Lucy-Robotics/so_arm101_urdf
          ref: 5d90fee78d5ddba0a1923f6e54d8102623c75b0a
          path: robot
      - uses: ./
        with:
          path: robot
